[project]
name = "budget"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11",
    "jinja2>=3.1",
]

[project.scripts]
budget = "budget.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
    "reportlab>=4",  # only to regenerate tests/fixtures/sample_statement.pdf
]
